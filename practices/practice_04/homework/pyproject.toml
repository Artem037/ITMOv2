[project]
name = "transit-trip-planner"
version = "0.1.0"
description = "Проверяемый расчёт загородных поездок для домашней работы 4"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "pydantic>=2.12,<3"]

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E501", "I"]

[tool.uv]
package = false
