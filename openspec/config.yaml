schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Target: Notify Mini in practices/practice_03/lab/demo.
  Python 3.10+, standard library only; subscribers live in process memory.
  Preserve subscribe(name), unsubscribe(name), list_subscribers(),
  their response dictionaries and the shared subscribers set object.
  Follow AGENTS.md and practices/practice_03/lab/demo/STYLE_GUIDE.md.
  Current practice: add a small case-insensitive substring filter to
  list_subscribers(query=""); trim query edges and preserve the old no-arg call.
  Preserve stored names, default sorting and process state; demonstrate locally.
  Do not add a database, HTTP server or third User Story (homework 5).
  Keep earlier experiment results, reports, configurations and homework 4 intact.
  Demo checks: make -C practices/practice_03/lab/demo test.
  Full checks from repository root: sh scripts/check.sh; git diff --check.
  Use real MCP fetch calls for relevant official Python library contracts.

rules:
  design:
    - Объясни взаимодействие диаграммой Mermaid.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
